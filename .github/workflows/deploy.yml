# CI/CD: check secrets, apply infra (only when terraform/ changed), then deploy the
# app over SSH. The server host is read from Terraform state (S3), so there is no
# SSH_HOST secret.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fail fast: every secret infra + deploy need, checked before anything runs.
  check-secrets:
    name: check secrets
    runs-on: ubuntu-latest
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_NAME: ${{ secrets.APP_NAME }}
      LOGS_USER: ${{ secrets.LOGS_USER }}
      LOGS_PASSWORD: ${{ secrets.LOGS_PASSWORD }}
    steps:
      - run: |
          missing=0
          for name in DIGITALOCEAN_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                      SSH_PUBLIC_KEY SSH_PRIVATE_KEY APP_NAME LOGS_USER LOGS_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set"; missing=1; fi
          done
          exit $missing

  changes:
    name: detect changes
    needs: check-secrets
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'

  infra:
    name: terraform apply
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_APP_NAME: ${{ secrets.APP_NAME }}
      TF_VAR_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform apply -input=false -auto-approve

  deploy:
    name: deploy over SSH
    needs: [changes, infra]
    if: ${{ always() && needs.changes.result == 'success' && needs.infra.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: /opt/${{ secrets.APP_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      LOGS_USER: ${{ secrets.LOGS_USER }}
      LOGS_PASSWORD: ${{ secrets.LOGS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Resolve server host from Terraform state
        id: host
        working-directory: terraform
        run: |
          terraform init -input=false
          echo "host=$(terraform output -raw server_ipv4)" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # A fresh droplet is "active" before cloud-init finishes (deploy user, /opt dir, Docker).
      - name: Wait for cloud-init
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: |
          for _ in $(seq 1 60); do
            if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10 -o BatchMode=yes \
                 "$DEPLOY_USER@$SSH_HOST" test -f /var/lib/cloud/bootstrap-complete 2>/dev/null; then
              echo "cloud-init finished"; exit 0
            fi
            sleep 10
          done
          echo "::error::cloud-init did not finish within 10 minutes on $SSH_HOST"; exit 1

      - name: Rsync to deploy path
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: >
          rsync -az --delete
          -e "ssh -i ~/.ssh/deploy_key"
          --filter=':- .gitignore'
          --exclude='.env'
          --exclude='.env.example'
          --exclude='.git/'
          ./ "$DEPLOY_USER@$SSH_HOST:$DEPLOY_PATH/"

      # Dozzle login: hash the secrets on the runner, ship the file (gitignored on the
      # server, so rsync --delete leaves it alone).
      - name: Write Dozzle users
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: |
          docker run --rm amir20/dozzle:v10.9.2 generate "$LOGS_USER" \
            --password "$LOGS_PASSWORD" --email "$LOGS_USER@localhost" --name "$LOGS_USER" > users.yml
          scp -i ~/.ssh/deploy_key users.yml "$DEPLOY_USER@$SSH_HOST:$DEPLOY_PATH/dozzle/users.yml"

      - name: Restart containers
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$SSH_HOST" \
            "docker compose --project-directory '$DEPLOY_PATH' down && \
             docker compose --project-directory '$DEPLOY_PATH' up -d --build"
