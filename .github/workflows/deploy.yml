# App deploy: rsync the repo to the server and rebuild the compose stack over SSH.
# Terraform (infra.yml) owns the server; this owns the app running on it.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]


concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required config
        run: |
          test -n "$SSH_HOST" || { echo "::error::secret SSH_HOST is not set"; exit 1; }
          test -n "$SSH_USER" || { echo "::error::secret SSH_USER is not set"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::secret DEPLOY_PATH is not set"; exit 1; }

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to deploy path
        run: >
          rsync -az --delete
          -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          --filter=':- .gitignore'
          --exclude='.env'
          --exclude='.env.example'
          --exclude='.git/'
          ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Restart containers
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker compose --project-directory '$DEPLOY_PATH' down && \
             docker compose --project-directory '$DEPLOY_PATH' up -d --build"
