# CI/CD: apply infra (only when terraform/ changed), then deploy the app over SSH.
# The server host is read from Terraform state (S3), so there is no SSH_HOST secret.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terraform:
              - 'terraform/**'

  infra:
    name: terraform apply
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      TF_VAR_OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      TF_VAR_OCI_REGION: ${{ secrets.OCI_REGION }}
      TF_VAR_OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_APP_NAME: ${{ secrets.APP_NAME }}
      TF_VAR_DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required config
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::secret TF_STATE_ACCESS_KEY is not set"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::secret TF_STATE_SECRET_KEY is not set"; exit 1; }
          test -n "$OCI_NAMESPACE" || { echo "::error::variable OCI_NAMESPACE is not set"; exit 1; }
          test -n "$TF_VAR_OCI_TENANCY_OCID" || { echo "::error::secret OCI_TENANCY_OCID is not set"; exit 1; }
          test -n "$TF_VAR_OCI_USER_OCID" || { echo "::error::secret OCI_USER_OCID is not set"; exit 1; }
          test -n "$TF_VAR_OCI_FINGERPRINT" || { echo "::error::secret OCI_FINGERPRINT is not set"; exit 1; }
          test -n "$TF_VAR_OCI_PRIVATE_KEY" || { echo "::error::secret OCI_PRIVATE_KEY is not set"; exit 1; }
          test -n "$TF_VAR_OCI_REGION" || { echo "::error::secret OCI_REGION is not set"; exit 1; }
          test -n "$TF_VAR_OCI_COMPARTMENT_OCID" || { echo "::error::secret OCI_COMPARTMENT_OCID is not set"; exit 1; }
          test -n "$TF_VAR_SSH_PUBLIC_KEY" || { echo "::error::secret SSH_PUBLIC_KEY is not set"; exit 1; }
          test -n "$TF_VAR_APP_NAME" || { echo "::error::secret APP_NAME is not set"; exit 1; }

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      # OCI Object Storage S3 endpoint is region/tenancy-specific → pass at init.
      - name: terraform init
        run: |
          cat > backend.hcl <<EOF
          region = "$TF_VAR_OCI_REGION"
          endpoints = { s3 = "https://$OCI_NAMESPACE.compat.objectstorage.$TF_VAR_OCI_REGION.oraclecloud.com" }
          EOF
          terraform init -input=false -backend-config=backend.hcl

      - run: terraform validate
      - run: terraform apply -input=false -auto-approve

  deploy:
    name: deploy over SSH
    needs: [changes, infra]
    if: ${{ always() && needs.changes.result == 'success' && needs.infra.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: /opt/${{ secrets.APP_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Resolve server host from Terraform state
        id: host
        working-directory: terraform
        run: |
          cat > backend.hcl <<EOF
          region = "$OCI_REGION"
          endpoints = { s3 = "https://$OCI_NAMESPACE.compat.objectstorage.$OCI_REGION.oraclecloud.com" }
          EOF
          terraform init -input=false -backend-config=backend.hcl
          echo "host=$(terraform output -raw server_ipv4)" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to deploy path
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: >
          rsync -az --delete
          -e "ssh -i ~/.ssh/deploy_key"
          --filter=':- .gitignore'
          --exclude='.env'
          --exclude='.env.example'
          --exclude='.git/'
          ./ "$DEPLOY_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Restart containers
        env:
          SSH_HOST: ${{ steps.host.outputs.host }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$SSH_HOST" \
            "docker compose --project-directory '$DEPLOY_PATH' down && \
             docker compose --project-directory '$DEPLOY_PATH' up -d --build"
