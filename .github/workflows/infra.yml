# Manual infra deploy (Terraform → Timeweb Cloud). Trigger from the Actions tab.
# State is stored in Timeweb S3 (backend "s3" in terraform/providers.tf); the S3
# access/secret keys are injected via the TF_STATE_* secrets below.
name: Infra (manual)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['terraform/**']

concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: terraform apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TWC_TOKEN: ${{ secrets.TWC_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
      TF_VAR_ssh_key_name: ${{ vars.SSH_KEY_NAME }}
      TF_VAR_app_name: ${{ vars.APP_NAME || 'myapp' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required config
        run: |
          test -n "$TWC_TOKEN" || { echo "::error::secret TWC_TOKEN is not set"; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::secret TF_STATE_ACCESS_KEY is not set"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::secret TF_STATE_SECRET_KEY is not set"; exit 1; }
          test -n "$TF_VAR_ssh_key_name" || { echo "::error::variable SSH_KEY_NAME is not set"; exit 1; }

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Outputs
        run: terraform output
