# Local stack. Run from repo root:
#   docker compose up --build
#
# Only nginx publishes a host port (80). postgres and api are reachable only
# on the internal compose network (no host ports) — the rest stays closed.
name: cifra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cifra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cifra}
      POSTGRES_DB: ${POSTGRES_DB:-cifra}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cifra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: services/api/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: postgres
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Edge: builds the React SPA and serves it (static) + proxies /api.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
