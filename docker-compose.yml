# Local stack. Run from repo root:
#   docker compose up --build
#
# Only nginx publishes a host port (80). postgres, rabbitmq, dozzle and the
# backend services are reachable only on the internal compose network.
#
# Every value comes from the root .env (compose loads it automatically for
# ${...} substitution) — the single source of truth, see .env.example. Each
# service is handed only the variables it needs, so infra/deploy secrets never
# enter an application container.
name: cifra

# Every container: rotated json-file logs (Dozzle and `docker compose logs` read these).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-cifra}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cifra}
  POSTGRES_DB: ${POSTGRES_DB:-cifra}

services:
  postgres:
    image: pgvector/pgvector:pg16
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cifra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cifra}
      POSTGRES_DB: ${POSTGRES_DB:-cifra}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cifra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-alpine
    logging: *default-logging
    expose:
      - "5672"
    # Durable queues survive a `down`/recreate only with the data dir on a volume.
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply Alembic migrations, then exit. Everything DB-backed waits on it.
  migrator:
    build:
      context: ./backend
      dockerfile: migrator/Dockerfile
    logging: *default-logging
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

  source_service:
    build:
      context: ./backend
      dockerfile: source_service/Dockerfile
    logging: *default-logging
    environment:
      <<: *postgres-env
      APP_NAME: ${APP_NAME:-AI Analytical Center}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-true}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NEWS_EXCHANGE: ${NEWS_EXCHANGE:-news}
      SOURCES_API_PREFIX: ${SOURCES_API_PREFIX:-/api/sources}
      SOURCE_POLL_INTERVAL_SECONDS: ${SOURCE_POLL_INTERVAL_SECONDS:-300}
      SOURCE_RSS_FEEDS_LIMIT: ${SOURCE_RSS_FEEDS_LIMIT:-10}
      RSS_DISCOVERY_MAX_DEPTH: ${RSS_DISCOVERY_MAX_DEPTH:-3}
      RSS_DISCOVERY_TIMEOUT_SECONDS: ${RSS_DISCOVERY_TIMEOUT_SECONDS:-30}
      RSS_DISCOVERY_RESPECT_ROBOTS: ${RSS_DISCOVERY_RESPECT_ROBOTS:-false}
      RSS_DISCOVERY_TRY_WELL_KNOWN_PATHS: ${RSS_DISCOVERY_TRY_WELL_KNOWN_PATHS:-true}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      WEB_CRAWL_DAYS: ${WEB_CRAWL_DAYS:-3}
      WEB_CRAWL_MAX_ARTICLES: ${WEB_CRAWL_MAX_ARTICLES:-50}
      WEB_CRAWL_LLM_ENABLED: ${WEB_CRAWL_LLM_ENABLED:-true}
      NEWS_AGENT_MODEL: ${NEWS_AGENT_MODEL:-deepseek/deepseek-v4-flash}
      NEWS_LLM_PROVIDER: ${NEWS_LLM_PROVIDER:-}
      NEWS_LLM_API_TOKEN: ${NEWS_LLM_API_TOKEN:-}
      NEWS_LLM_BASE_URL: ${NEWS_LLM_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Consumes the `news` exchange in batches into the shared DB; serves CRUD on /api/news.
  news_service:
    build:
      context: ./backend
      dockerfile: news_service/Dockerfile
    logging: *default-logging
    environment:
      <<: *postgres-env
      APP_NAME: ${APP_NAME:-AI Analytical Center}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-true}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NEWS_EXCHANGE: ${NEWS_EXCHANGE:-news}
      NEWS_QUEUE: ${NEWS_QUEUE:-news.raw}
      NEWS_BATCH_SIZE: ${NEWS_BATCH_SIZE:-100}
      NEWS_BATCH_INTERVAL_SECONDS: ${NEWS_BATCH_INTERVAL_SECONDS:-60}
      NEWS_REQUEUE_ON_STORE_ERROR: ${NEWS_REQUEUE_ON_STORE_ERROR:-true}
      NEWS_DEDUP_EXTRACTOR_MODEL: ${NEWS_DEDUP_EXTRACTOR_MODEL:-openai/gpt-5-mini}
      NEWS_DEDUP_VERIFIER_MODEL: ${NEWS_DEDUP_VERIFIER_MODEL:-deepseek/deepseek-v4-flash-0731}
      NEWS_DEDUP_LLM_BATCH_SIZE: ${NEWS_DEDUP_LLM_BATCH_SIZE:-20}
      NEWS_DEDUP_EMBEDDING_MODEL: ${NEWS_DEDUP_EMBEDDING_MODEL:-baai/bge-m3}
      NEWS_DEDUP_EMBEDDING_BATCH_SIZE: ${NEWS_DEDUP_EMBEDDING_BATCH_SIZE:-64}
      NEWS_DEDUP_CANDIDATE_WINDOW_DAYS: ${NEWS_DEDUP_CANDIDATE_WINDOW_DAYS:-3}
      NEWS_DEDUP_TOP_K_CANDIDATES: ${NEWS_DEDUP_TOP_K_CANDIDATES:-6}
      NEWS_DEDUP_MIN_RETRIEVAL_SCORE: ${NEWS_DEDUP_MIN_RETRIEVAL_SCORE:-0.16}
      NEWS_DEDUP_REJECT_IF_ANY_UNCERTAIN_CANDIDATE: ${NEWS_DEDUP_REJECT_IF_ANY_UNCERTAIN_CANDIDATE:-true}
      NEWS_RANKING_IMPACT_MODEL: ${NEWS_RANKING_IMPACT_MODEL:-deepseek/deepseek-v4-flash-0731}
      NEWS_RANKING_LLM_BATCH_SIZE: ${NEWS_RANKING_LLM_BATCH_SIZE:-20}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      NEWS_API_PREFIX: ${NEWS_API_PREFIX:-/api/news}
      NPA_SERVICE_URL: http://npa_service:8000
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      npa_service:
        condition: service_started

  # Legislative acts (НПА): list / get / create on /api/npa; news_service posts escalated alerts here.
  npa_service:
    build:
      context: ./backend
      dockerfile: npa_service/Dockerfile
    logging: *default-logging
    environment:
      <<: *postgres-env
      APP_NAME: ${APP_NAME:-AI Analytical Center}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-true}
      NPA_API_PREFIX: ${NPA_API_PREFIX:-/api/npa}
      NPA_POLL_INTERVAL_SECONDS: ${NPA_POLL_INTERVAL_SECONDS:-86400}
      NPA_SIMULATION_ENABLED: ${NPA_SIMULATION_ENABLED:-false}
      NPA_REQUEST_TIMEOUT_SECONDS: ${NPA_REQUEST_TIMEOUT_SECONDS:-30}
      NPA_MAX_DOWNLOAD_BYTES: ${NPA_MAX_DOWNLOAD_BYTES:-12000000}
      NPA_CHANGE_MODEL: ${NPA_CHANGE_MODEL:-deepseek/deepseek-v4-flash-0731}
      NPA_MAX_DIFF_CHARS: ${NPA_MAX_DIFF_CHARS:-120000}
      NPA_ARTICLE_CHANGES_MAX_OUTPUT_TOKENS: ${NPA_ARTICLE_CHANGES_MAX_OUTPUT_TOKENS:-1200}
      NPA_OVERALL_SUMMARY_MAX_OUTPUT_TOKENS: ${NPA_OVERALL_SUMMARY_MAX_OUTPUT_TOKENS:-4000}
      NPA_USER_AGENT: ${NPA_USER_AGENT:-CifraNpaMonitor/1.0 (+https://sozd.duma.gov.ru/)}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Container log viewer, reachable only through nginx at ${LOGS_PREFIX}. Login is
  # Dozzle's own: users come from ./dozzle/users.yml (gitignored; the deploy job writes it
  # from LOGS_USER/LOGS_PASSWORD, locally see dozzle/README.md). Read-only docker socket.
  dozzle:
    image: amir20/dozzle:v10.9.2
    logging: *default-logging
    environment:
      DOZZLE_BASE: ${LOGS_PREFIX:-/logs}
      DOZZLE_FILTER: label=com.docker.compose.project=cifra
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data:ro
    expose:
      - "8080"

  # Edge: builds the SPA (VITE_* are baked in at build time), serves it static,
  # reverse-proxies /api/<service>/* to the backend services and /logs to dozzle.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        SOURCES_API_PREFIX: ${SOURCES_API_PREFIX:-/api/sources}
        NEWS_API_PREFIX: ${NEWS_API_PREFIX:-/api/news}
        NPA_API_PREFIX: ${NPA_API_PREFIX:-/api/npa}
    logging: *default-logging
    environment:
      SOURCES_API_PREFIX: ${SOURCES_API_PREFIX:-/api/sources}
      NEWS_API_PREFIX: ${NEWS_API_PREFIX:-/api/news}
      NPA_API_PREFIX: ${NPA_API_PREFIX:-/api/npa}
      LOGS_PREFIX: ${LOGS_PREFIX:-/logs}
    ports:
      - "80:80"
    depends_on:
      - source_service
      - news_service
      - npa_service
      - dozzle

volumes:
  pgdata:
  rabbitmq_data:
