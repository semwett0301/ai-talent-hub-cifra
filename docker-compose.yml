# Local stack. Run from repo root:
#   docker compose up --build
#
# Only nginx publishes a host port (80). postgres, rabbitmq and the backend
# services are reachable only on the internal compose network.
#
# Every value comes from the root .env (compose loads it automatically for
# ${...} substitution) — the single source of truth, see .env.example. Each
# service is handed only the variables it needs, so infra/deploy secrets never
# enter an application container.
name: cifra

x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-cifra}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cifra}
  POSTGRES_DB: ${POSTGRES_DB:-cifra}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cifra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cifra}
      POSTGRES_DB: ${POSTGRES_DB:-cifra}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cifra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-alpine
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply Alembic migrations, then exit. Everything DB-backed waits on it.
  migrator:
    build:
      context: ./backend
      dockerfile: migrator/Dockerfile
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

  source_service:
    build:
      context: ./backend
      dockerfile: source_service/Dockerfile
    environment:
      <<: *postgres-env
      APP_NAME: ${APP_NAME:-AI Analytical Center}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      NEWS_EXCHANGE: ${NEWS_EXCHANGE:-news}
      SOURCES_API_PREFIX: ${SOURCES_API_PREFIX:-/api/sources}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      WEB_CRAWL_DAYS: ${WEB_CRAWL_DAYS:-3}
      WEB_CRAWL_MAX_ARTICLES: ${WEB_CRAWL_MAX_ARTICLES:-50}
      WEB_CRAWL_LLM_ENABLED: ${WEB_CRAWL_LLM_ENABLED:-true}
      NEWS_AGENT_MODEL: ${NEWS_AGENT_MODEL:-deepseek/deepseek-v4-flash}
      NEWS_LLM_PROVIDER: ${NEWS_LLM_PROVIDER:-}
      NEWS_LLM_API_TOKEN: ${NEWS_LLM_API_TOKEN:-}
      NEWS_LLM_BASE_URL: ${NEWS_LLM_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    expose:
      - "8000"
    # Pull-source schedules live in process. Keep one replica until a shared
    # scheduler/leader lock is introduced; otherwise every replica crawls and
    # publishes the same WEB/RSS source independently.
    deploy:
      replicas: ${SOURCE_SERVICE_REPLICAS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Edge: builds the SPA (VITE_* are baked in at build time), serves it static
  # and reverse-proxies /api/* to the internal source_service.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    environment:
      SOURCES_API_PREFIX: ${SOURCES_API_PREFIX:-/api/sources}
    ports:
      - "80:80"
    depends_on:
      - source_service

volumes:
  pgdata:
