# Local stack. Run from repo root:
#   docker compose up --build
#
# Only nginx publishes a host port (80). postgres and api are reachable only
# on the internal compose network (no host ports) — the rest stays closed.
name: cifra

# Single source of truth for the nginx location source_service is mounted
# under; nginx substitutes it into its config template and source_service
# reads it back as FastAPI's root_path — change it once, here.
x-sources-api-prefix: &sources_api_prefix "/api/sources"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cifra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cifra}
      POSTGRES_DB: ${POSTGRES_DB:-cifra}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cifra}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-alpine
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply Alembic migrations, then exit. Everything DB-backed waits on it.
  migrator:
    build:
      context: ./backend
      dockerfile: migrator/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  source_service:
    build:
      context: ./backend
      dockerfile: source_service/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SOURCES_API_PREFIX: *sources_api_prefix
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Edge: serves the static SPA and reverse-proxies /api/* to the internal
  # source_service. depends_on so the upstream host resolves at boot.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      SOURCES_API_PREFIX: *sources_api_prefix
    ports:
      - "80:80"
    depends_on:
      - source_service

volumes:
  pgdata:
