# Dev overlay: the frontend served live by a Vite dev server instead of the built bundle.
# Not standalone — merge it over docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# (or set COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml in .env and use
# plain `docker compose up --build`).
#
# http://localhost/ is then the live frontend from ./frontend: an edit reloads in the
# browser, /api/* still goes to the backend services. nginx stays the only published
# port — it proxies / (and the HMR websocket) to frontend_dev, and is built from the
# `edge` stage, so the SPA is not compiled at all in this mode.
services:
  nginx:
    build:
      target: edge
    environment:
      FRONTEND_MODE: dev
    depends_on:
      - frontend_dev

  frontend_dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # Only used if something hits Vite's own /api proxy; the browser goes through nginx.
      DEV_API_TARGET: http://nginx
      SOURCES_API_PREFIX: ${SOURCES_API_PREFIX:-/api/sources}
      NEWS_API_PREFIX: ${NEWS_API_PREFIX:-/api/news}
      NPA_API_PREFIX: ${NPA_API_PREFIX:-/api/npa}
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the image's linux node_modules over the host's macOS ones.
      # After a package.json change run `up --build -V` so it is recreated from the new image.
      - /app/node_modules
    expose:
      - "5173"
