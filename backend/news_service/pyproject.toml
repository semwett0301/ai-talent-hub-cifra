[project]
name = "news-service"
version = "0.1.0"
description = "News service — consume NewsDTOs from RabbitMQ in batches, store them, serve list + dismiss + escalate to npa_service"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "aio-pika==9.5.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
