[project]
name = "cifra-api"
version = "0.1.0"
description = "Dashboard / CRUD API service (skeleton)"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
