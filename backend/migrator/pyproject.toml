[project]
name = "migrator"
version = "0.1.0"
description = "One-shot Alembic migrator — owns the shared DB schema history for all services"
requires-python = ">=3.12"
# Runtime deps — what `alembic upgrade head` needs. All ORM models live in the
# shared `domain` package (domain.schemas), so no service packages are pulled in.
dependencies = [
    "domain",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
]

# Not an importable package — just Alembic config + migrations run in-place.
[tool.uv]
package = false
