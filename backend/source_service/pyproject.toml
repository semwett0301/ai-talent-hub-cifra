[project]
name = "source-service"
version = "0.1.0"
description = "Source ingestion service — CRUD sources, collect news, publish to RabbitMQ"
requires-python = ">=3.12"
dependencies = [
    "common",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "aio-pika==9.5.4",
    "apscheduler==3.11.0",
    "kurigram==2.2.25",
    "crawl4ai==0.9.3",
    "aiohttp==3.14.3",
    "feedparser==6.0.14",
    "news-please==1.6.16",
    "beautifulsoup4==4.15.0",
    "python-dateutil==2.9.0.post0",
    "litellm==1.95.1",
    "feedsearch-crawler==2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
