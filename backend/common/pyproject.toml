[project]
name = "common"
version = "0.1.0"
description = "Shared library for all services (config, logging, contracts; grows as needed)"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
]

# Hatchling auto-detects the `common/` package next to this file (name matches the
# project), so no explicit [tool.hatch.build.targets.wheel] packages list is needed.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
