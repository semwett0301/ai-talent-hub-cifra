[project]
name = "common"
version = "0.1.0"
description = "Shared kernel for all services (config, logging, DB, bus consumer, contracts, ORM schemas)"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.2",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "aio-pika==9.5.4",
    "pgvector>=0.3,<1",
]

# Hatchling auto-detects the `common/` package next to this file (name matches the
# project), so no explicit [tool.hatch.build.targets.wheel] packages list is needed.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
