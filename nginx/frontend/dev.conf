# location / body, FRONTEND_MODE=dev (docker-compose.dev.yml): proxy everything that is
# not an /api location to the Vite dev server, including its HMR websocket.
set $frontend_backend http://frontend_dev:5173;
proxy_pass $frontend_backend;

proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
