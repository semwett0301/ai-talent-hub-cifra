# The only service exposed to the host. Serves the built React SPA as static
# files and proxies /api to the backend (internal, closed network).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forwarded to every proxied backend (inherited by the /api locations below).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/sources(?:/(.*))?$ {
        rewrite ^/api/sources(?:/(.*))?$ /$1 break;
        proxy_pass http://source_service:8000;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
