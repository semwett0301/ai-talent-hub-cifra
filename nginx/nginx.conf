# The only service exposed to the host. Serves the built React SPA as static
# files and proxies /api to the backend (internal, closed network).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # Reverse proxy: public /api/* → source_service (the /api prefix is stripped,
    # so /api/sources → /sources).
    location /api/ {
        proxy_pass http://source_service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
